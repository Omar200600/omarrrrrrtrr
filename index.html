<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المساعد الافتراضي للأستاذ عمر حسان - الفيزياء</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f0f4f8; margin: 0; padding: 15px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .chat-card { background: #ffffff; width: 100%; max-width: 500px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); overflow: hidden; display: flex; flex-direction: column; height: 90vh; }
        .header { background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; padding: 20px; text-align: center; }
        .avatar { width: 80px; height: 80px; background: #00d2ff; border-radius: 50%; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-size: 40px; border: 3px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .header h2 { margin: 0; font-size: 1.2rem; }
        .header p { margin: 5px 0 0; font-size: 0.85rem; opacity: 0.9; }
        .chat-box { flex: 1; padding: 15px; overflow-y: auto; background: #f9fbfd; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 15px; font-size: 0.95rem; line-height: 1.4; }
        .bot-msg { background: #e3eedb; color: #1b4332; align-self: flex-start; border-bottom-right-radius: 2px; }
        .user-msg { background: #2a5298; color: white; align-self: flex-end; border-bottom-left-radius: 2px; }
        .controls { padding: 15px; background: white; border-top: 1px solid #eee; display: flex; gap: 8px; align-items: center; }
        input[type="text"] { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 25px; outline: none; font-size: 0.95rem; }
        button { background: #2a5298; color: white; border: none; padding: 12px 18px; border-radius: 25px; cursor: pointer; font-weight: bold; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .mic-btn { background: #e74c3c; border-radius: 50%; width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; padding: 0; }
    </style>
</head>
<body>

<div class="chat-card">
    <div class="header">
        <div class="avatar">👨‍🏫</div>
        <h2>المساعد الافتراضي للفيزياء</h2>
        <p>تحت إشراف: الأستاذ عمر حسان عبره</p>
    </div>

    <div class="chat-box" id="chatBox">
        <div class="message bot-msg">
            أهلاً بك يا بطل! أنا المساعد الافتراضي الخاص بالأستاذ عمر حسان عبره لمادة الفيزياء. اسألني أي سؤال في منهج الفيزياء وسأشرحه لك فوراً!
        </div>
    </div>

    <div class="controls">
        <button class="mic-btn" onclick="startVoice()" title="تحدث بالميكروفون">🎙️</button>
        <input type="text" id="userInput" placeholder="اسأل المساعد سؤالاً في الفيزياء..." onkeypress="handleKey(event)">
        <button id="sendBtn" onclick="sendMessage()">إرسال</button>
    </div>
</div>

<script>
    const OPENROUTER_API_KEY = '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';
    
    // استخدام نموذج مجاني ذو اعتمادية عالية ومستقر على OpenRouter
    const MODEL_NAME = 'meta-llama/llama-3.2-1b-instruct:free';

    function speak(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ar-SA';
            utterance.rate = 0.95;
            window.speechSynthesis.speak(utterance);
        }
    }

    function addMessage(text, isUser, id = null) {
        const chatBox = document.getElementById('chatBox');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${isUser ? 'user-msg' : 'bot-msg'}`;
        if (id) msgDiv.id = id;
        msgDiv.innerText = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
        if (!isUser && !id) speak(text);
        return msgDiv;
    }

    async function fetchAIResponse(userPrompt) {
        const systemPrompt = "أنت المعلم الافتراضي لمادة الفيزياء للثانوية العامة التابع للأستاذ عمر حسان عبره. اشرح المفاهيم بأسلوب علمي مبسط ومحفز للطلاب باللغة العربية.";

        try {
            const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${OPENROUTER_API_KEY}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    "model": MODEL_NAME,
                    "messages": [
                        { "role": "system", "content": systemPrompt },
                        { "role": "user", "content": userPrompt }
                    ]
                })
            });

            const data = await response.json();

            if (!response.ok) {
                console.error("OpenRouter Error Details:", data);
                return `خطأ من السيرفر (${response.status}): ${data.error ? data.error.message : 'يرجى التحقق من صلاحية المفتاح أو النموذج'}`;
            }

            if (data.choices && data.choices[0] && data.choices[0].message) {
                return data.choices[0].message.content;
            } else {
                return "استلم السيرفر الطلب ولكن لم يرجع نصاً. أعد المحاولة.";
            }

        } catch (error) {
            console.error("Fetch Error:", error);
            return "حدث خطأ في الشبكة أثناء الاتصال بالمعلم الافتراضي.";
        }
    }

    async function sendMessage() {
        const input = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const text = input.value.trim();
        if (!text) return;

        addMessage(text, true);
        input.value = '';
        input.disabled = true;
        sendBtn.disabled = true;

        const loadingMsg = addMessage("الأستاذ يفكر ويعد الشرح...", false, "loading-msg");

        const aiReply = await fetchAIResponse(text);

        const loadingElem = document.getElementById("loading-msg");
        if (loadingElem) loadingElem.remove();

        addMessage(aiReply, false);

        input.disabled = false;
        sendBtn.disabled = false;
        input.focus();
    }

    function handleKey(e) {
        if (e.key === 'Enter') sendMessage();
    }

    function startVoice() {
        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
            alert("خاصية تحويل الصوت إلى نص غير مدعومة على هذا المتصفح.");
            return;
        }
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.lang = 'ar-SA';
        recognition.start();

        recognition.onresult = function(event) {
            const transcript = event.results[0][0].transcript;
            document.getElementById('userInput').value = transcript;
            sendMessage();
        };
    }
</script>

</body>
</html>
